version: '3.8'

services:
  # ==========================================
  # MySQL Database Service
  # ==========================================
  mysql-db:
    image: mysql:8.4
    container_name: hardwareshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rd@2}
      MYSQL_DATABASE: ${DB_NAME:-hardwareshop_db}
      MYSQL_USER: ${DB_USERNAME:-hardware_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rd@2}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hardwareshop-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rd@2}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # Spring Boot Application Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hardwareshop-backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql-db:3306/${DB_NAME:-hardwareshop_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rd@2}
      JWT_SECRET: ${JWT_SECRET:-dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTYWxlc0hhcmR3YXJlU2hvcEFwcGxpY2F0aW9uMjAyNg==}
      JWT_EXPIRATION_MS: 86400000
      ALLOWED_ORIGINS: "*"
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      ADMIN_ALERT_PHONE: ${ADMIN_ALERT_PHONE:-+919876543210}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SHOP_NAME: "XYZ HARDWARE SHOP"
      SHOP_CONTACT: "+91 98765 43210"
      SHOP_ADDRESS: "Shop #12, Central Hardware Market, Sector 18, Greater Noida, UP"
      STORAGE_UPLOAD_DIR: "/app/uploads/products"
    volumes:
      - app_uploads:/app/uploads
    networks:
      - hardwareshop-net

volumes:
  mysql_data:
    driver: local
  app_uploads:
    driver: local

networks:
  hardwareshop-net:
    driver: bridge
