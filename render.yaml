services:
  # ==========================================
  # Spring Boot Java 21 Backend Web Service
  # 100% Free - Zero Credit Card Required
  # ==========================================
  - type: web
    name: hardwareshop-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        value: "jdbc:h2:file:/app/data/hardwareshop_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL"
      - key: DB_USERNAME
        value: "sa"
      - key: DB_PASSWORD
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: NOTIFICATION_PROVIDER
        value: mock
      - key: ADMIN_ALERT_PHONE
        value: "+919876543210"
      - key: ALLOWED_ORIGINS
        value: "*"

  # ==========================================
  # React 19 Frontend Static Web App
  # 100% Free - Zero Credit Card Required
  # ==========================================
  - type: web
    name: hardwareshop-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: hardwareshop-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
