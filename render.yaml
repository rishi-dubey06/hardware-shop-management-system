services:
  # ==========================================
  # Spring Boot Java 21 Backend Service
  # ==========================================
  - type: web
    name: hardwareshop-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NOTIFICATION_PROVIDER
        value: mock
      - key: ADMIN_ALERT_PHONE
        value: "+919876543210"
      - key: ALLOWED_ORIGINS
        value: "*"

  # ==========================================
  # React 19 Frontend Web Service
  # ==========================================
  - type: web
    name: hardwareshop-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
