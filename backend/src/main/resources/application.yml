server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: hardware-shop-management-system

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/hardwareshop_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTYWxlc0hhcmR3YXJlU2hvcEFwcGxpY2F0aW9uMjAyNg==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:*}
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads/products}
  notification:
    provider: ${NOTIFICATION_PROVIDER:mock} # mock, twilio, meta, or rest
    admin-phone: ${ADMIN_ALERT_PHONE:+919876543210}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      phone-number: ${TWILIO_PHONE_NUMBER:}
      whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
    meta:
      api-token: ${WHATSAPP_API_KEY:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    whatsapp:
      api-url: ${WHATSAPP_API_URL:}
      api-key: ${WHATSAPP_API_KEY:}
    sms:
      api-url: ${SMS_API_URL:}
      api-key: ${SMS_API_KEY:}
  shop:
    name: ${SHOP_NAME:XYZ HARDWARE SHOP}
    contact: ${SHOP_CONTACT:+91 98765 43210}
    address: ${SHOP_ADDRESS:Shop #12, Central Hardware Market, Sector 18, Greater Noida, UP}
    gstin: ${SHOP_GSTIN:09AABCU9603R1ZM}
    state: ${SHOP_STATE:09 - Uttar Pradesh}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.hardwareshop: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
