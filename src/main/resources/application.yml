server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: hardware-shop-management-system

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hardwareshop_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rd@2}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JTYWxlc0hhcmR3YXJlU2hvcEFwcGxpY2F0aW9uMjAyNg==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:*}
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads/products}
  notification:
    provider: ${NOTIFICATION_PROVIDER:mock} # mock or rest
    admin-phone: ${ADMIN_ALERT_PHONE:+919876543210}
    whatsapp:
      api-url: ${WHATSAPP_API_URL:}
      api-key: ${WHATSAPP_API_KEY:}
    sms:
      api-url: ${SMS_API_URL:}
      api-key: ${SMS_API_KEY:}
  shop:
    name: ${SHOP_NAME:XYZ HARDWARE SHOP}
    contact: ${SHOP_CONTACT:+91 98765 43210}
    address: ${SHOP_ADDRESS:Shop #12, Central Hardware Market, Sector 18, Greater Noida, UP}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.hardwareshop: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
